<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Box model HTML</title>
        <script src="../validate.js"></script>
<style>
        #redbox{
        background-color:red;
       height:100px;
       width:100px;
       border:2px black solid;
       background-clip:content-box;
       margin-left:300px;
        }
        #bluebox{
            background-color:blue;
            height:100px;
            width:100px;
            padding:100px;
            border:2px black solid;
            background-clip:content-box;
            margin-left:400px; 
        }
        #greenbox{
            background-color:green;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            padding-left:20px;
        }
        #yellowbox{
            background-color:yellow;
            height:100px;
            width:100px;
            border:2px black solid;
            padding-top:30px;
            padding-left:20px;
            padding-right:20px;
            background-clip:content-box;
            margin-left:300px;
        }
        #purplebox{
            background-color:purple;
            height:100px;
            width:100px;
            border:2px black solid;
            padding-bottom:100px;
            background-clip:content-box;
            margin-left:200px;


        }
</style>


    </head>

    <body>
        
        <h1>Look at le boxes</h1>
        <div id="redbox"></div>
        <div id="bluebox"></div>
        <div id="greenbox"></div>
        <div id="yellowbox"></div>
        <div id="purplebox"></div>
    </body>

</html>
